name: Apply Patch
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/*.yml
permissions:
  contents: write
jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: '0'
    - name: Decode patch
      run: echo "$PATCH_B64" | base64 -d | gunzip > fix.patch
      env:
        PATCH_B64: 
    - name: Apply patch
      run: git apply --unidiff-zero fix.patch
    - name: Commit
      run: 'git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com" && git add index.html && git commit -m "fix: remove duplicate </tr> line and escape <script> in JS comment that broke sign-in"'
    - name: Remove workflow and patch files
      run: git rm -f .github/workflows/apply-patch.yml && rm -f fix.patch
    - name: Push
      run: git push