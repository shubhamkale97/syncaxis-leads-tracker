name: Apply Reorder Patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    env:
      PATCH_GZ_B64: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: |
          echo "$PATCH_GZ_B64" | base64 -d | gunzip > fix.patch
          git apply --unidiff-zero --verbose fix.patch
          rm -f fix.patch

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: reorder All Leads columns -- Enquiry No, Company, Lead Value, Notes at front"
          git rm -f .github/workflows/apply-patch.yml
          git commit -m "chore: remove temporary patch workflow"
          git push