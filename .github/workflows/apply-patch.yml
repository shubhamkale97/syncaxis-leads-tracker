name: Apply Reorder Patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    env:
      PATCH_B64: ""
      COMMIT_MSG: "refactor: reorder All Leads columns — Enquiry No, Company, Lead Value, Notes at front"