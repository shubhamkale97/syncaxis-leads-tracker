name: Apply Patch Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch and push
        run: |
          set -euo pipefail
          git apply --unidiff-zero --check fix.patch.b64
          git apply --unidiff-zero fix.patch.b64
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: uncrowd All Leads table columns and center login screen on all viewports"
          git push origin main

      - name: Output commit SHA
        run: echo "Commit SHA is $(git rev-parse HEAD)"
