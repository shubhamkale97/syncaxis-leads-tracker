name: Apply Patch Once

on:
  workflow_dispatch:
    inputs:
      patch_b64:
        description: 'Base64-encoded git patch'
        required: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch and push
        env:
          PATCH_B64: ${{ inputs.patch_b64 }}
        run: |
          set -euo pipefail
          echo "$PATCH_B64" | base64 -d > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: uncrowd All Leads table columns and center login screen on all viewports"
          git push origin main

      - name: Output commit SHA
        run: echo "Commit SHA is $(git rev-parse HEAD)"
