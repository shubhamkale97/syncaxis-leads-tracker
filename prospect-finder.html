<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospect Finder — Syncaxis</title>
<style>
  :root{
    --bg:#12151b; --panel:#181c24; --panel2:#1e232d; --line:#2a3140;
    --ink:#e6eaf2; --muted:#9aa4b8; --faint:#6b7688;
    --accent:#4a90d9; --warn:#f0a63b; --good:#4cb782; --bad:#d96a6a; --violet:#c9a4f0;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1400px;margin:0 auto;padding:20px}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:18px}
  .eyebrow{color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  h1{margin:2px 0 0;font-size:22px;font-weight:600}
  .sub{color:var(--muted);font-size:13px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .b-a{background:rgba(76,183,130,.16);color:var(--good)}
  .b-b{background:rgba(240,166,59,.16);color:var(--warn)}
  .b-c{background:rgba(154,164,184,.14);color:var(--muted)}
  .b-dup{background:rgba(217,106,106,.16);color:var(--bad)}
  .b-hot{background:rgba(201,164,240,.16);color:var(--violet)}
  .section-note{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.45}
  .msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px}
  .msg.info{background:rgba(74,144,217,.10);color:#8fc2f0;border:1px solid rgba(74,144,217,.22)}
  .msg.ok{background:rgba(76,183,130,.10);color:#7fd0a8;border:1px solid rgba(76,183,130,.22)}
  .msg.err{background:rgba(217,106,106,.10);color:#f0a0a0;border:1px solid rgba(217,106,106,.22)}
  .msg a{color:inherit;text-decoration:underline}
  .msg code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;font-size:12px}
  .auth-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .auth-bar input{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:13px}
  .auth-bar input::placeholder{color:var(--faint)}
  .auth-bar .who{font-size:12px;color:var(--muted)}
  .auth-bar button,.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  .auth-bar button:hover,.btn:hover{border-color:var(--accent)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{filter:brightness(1.1)}
  .btn-primary:disabled{opacity:.5;cursor:default}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
  .filters label{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:3px}
  .filters input,.filters select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit}
  .qpreview{font-size:12px;color:var(--faint);margin:6px 0 14px;font-style:italic}
  .kpis{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:90px}
  .kpi b{display:block;font-size:20px;color:var(--ink)}
  .kpi span{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
  .results{margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);color:var(--faint);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
  tbody td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr.dup{opacity:.5}
  tbody tr:hover{background:var(--panel)}
  .co{font-weight:600;color:var(--ink)}
  .meta{font-size:11px;color:var(--faint);margin-top:2px}
  .score{font-size:16px;font-weight:700}
  .bd{font-size:11.5px;color:var(--muted);max-width:180px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hide{display:none}
  .preview-tag{display:inline-block;background:rgba(201,164,240,.16);color:var(--violet);padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;margin-bottom:12px}
  @media(max-width:720px){thead{display:none}tbody td{display:block;border:none;padding:2px 0}tbody tr{border-bottom:1px solid var(--line);padding:6px 0}.bd{max-width:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Syncaxis</div>
      <h1>Prospect Finder</h1>
      <div class="sub">Find industrial companies, learn what they do, and surface their resources and decision-maker contacts.</div>
    </div>
  </header>
  <div id="authBar" class="auth-bar"></div>
  <div id="msg"></div>
  <div id="previewTag" class="preview-tag hide">PREVIEW MODE — sample data, nothing is searched or saved.</div>

  <div class="filters">
    <div>
      <label>State</label>
      <select id="fState"></select>
    </div>
    <div>
      <label>City</label>
      <input id="fCity" placeholder="e.g. Pune, Chakan…">
    </div>
    <div>
      <label>Industry</label>
      <select id="fInd"></select>
    </div>
    <div>
      <label>Application</label>
      <select id="fApp"></select>
    </div>
    <div>
      <label>Keywords</label>
      <input id="fKw" placeholder="e.g. gearbox, sheet metal…">
    </div>
  </div>
  <div class="qpreview" id="qPreview"></div>

  <div class="toolbar">
    <button class="btn btn-primary" id="go">Find prospects</button>
    <button class="btn" id="pullIM" style="display:none;">Sync IndiaMART now</button>
  </div>

  <div id="results" class="results hide">
    <div class="kpis">
      <div class="kpi"><span>Found</span><b id="kFound">0</b></div>
      <div class="kpi"><span>Fresh</span><b id="kFresh">0</b></div>
      <div class="kpi"><span>Dupes</span><b id="kDup">0</b></div>
      <div class="kpi"><span>Tier A</span><b id="kA">0</b></div>
      <div class="kpi"><span>API calls</span><b id="kCalls">0</b></div>
    </div>
    <div class="toolbar">
      <button class="btn" id="selAll">Select all</button>
      <button class="btn" id="selA">Select Tier A</button>
      <button class="btn" id="clearSel">Clear</button>
      <button class="btn btn-primary" id="promote" disabled>Push <span id="selCount">0</span> to Leads</button>
      <span style="margin-left:auto;display:flex;gap:8px;align-items:center;">
        <select id="assignTo" style="background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 8px;font-size:12.5px;"></select>
        <button class="btn" id="exportCsv">Export CSV</button>
      </span>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:24px;"></th>
          <th>Score</th>
          <th>Company</th>
          <th>Location</th>
          <th>Industry</th>
          <th>Application</th>
          <th>Brand</th>
          <th>Contact</th>
          <th>Why</th>
          <th>Map</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-functions.js';

/* Same project as the Leads Tracker. The apiKey here is a public client
   identifier, not a secret — Google Places / IndiaMART / Apollo keys live in
   Secret Manager and are only ever touched by Cloud Functions. */
const firebaseConfig = {
  apiKey: "AIzaSyBN1ow9mkIgYhdmLiCVGCa9OSPEvCFOCd0",
  authDomain: "exhibition-lead-dashboard.firebaseapp.com",
  projectId: "exhibition-lead-dashboard",
  storageBucket: "exhibition-lead-dashboard.firebasestorage.app",
  messagingSenderId: "597395521176",
  appId: "1:597395521176:web:dd44b202af24c751631aed"
};

/* Firebase Auth only accepts requests from an authorised domain. Opening this
   file straight from disk gives a file:// origin, which is never authorised
   and fails with auth/unauthorized-domain no matter what the password is.
   Say so plainly instead of showing a cryptic Firebase error. */
if (location.protocol === 'file:' && new URLSearchParams(location.search).get('preview') !== '1') {
  document.body.insertAdjacentHTML('afterbegin',
    '<div style="margin:16px;padding:14px;border-radius:8px;background:rgba(217,106,106,.14);' +
    'color:#d96a6a;border:1px solid rgba(217,106,106,.35);font:14px system-ui">' +
    "<b>Opened from disk (file://) — sign-in cannot work here.</b><br>" +
    'Firebase Auth only accepts authorised domains. Push this file to the ' +
    'syncaxis-leads-tracker repo and open ' +
    '<code>inquiry.syncaxis.com/prospect-finder.html</code>, or serve it locally ' +
    'with <code>npx serve .</code> and open <code>http://localhost:3000</code> ' +
    '(add <code>localhost</code> under Firebase Console → Authentication → ' +
    'Settings → Authorised domains).</div>');
}

/* Preview must render even when the Firebase SDK cannot initialise at all
   (opened from disk, offline, CDN blocked). Nothing below is needed to show
   sample data, so a failure here is downgraded to a console warning. */
let app = null, auth = null, fns = null, sdkError = sdkLoadError;
if (initializeApp) {
  try {
    app  = initializeApp(firebaseConfig);
    auth = getAuth(app);
    fns  = getFunctions(app, 'asia-south1');
  } catch (e) {
    sdkError = e;
    console.warn('Firebase SDK did not initialise:', e);
  }
}

const call = fns ? {
  search:   httpsCallable(fns, 'searchProspects'),
  taxonomy: httpsCallable(fns, 'getTaxonomy'),
  promote:  httpsCallable(fns, 'promoteProspects'),
  enrich:   httpsCallable(fns, 'enrichProspect'),
  imNow:    httpsCallable(fns, 'pullIndiaMartLeadsNow'),
} : {};

const $ = id => document.getElementById(id);
let ROWS = [], SELECTED = new Set(), TAX = null;

const STATES = ['Maharashtra','Gujarat','Karnataka','Tamil Nadu','Telangana','Haryana','Punjab',
  'Delhi NCR','Uttar Pradesh','Rajasthan','Madhya Pradesh','West Bengal','Andhra Pradesh','Kerala','Odisha'];

function msg (text, kind = 'info') {
  $('msg').innerHTML = text ? `<div class="msg ${kind}">${text}</div>` : '';
}
function esc (s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&','<':'<','>':'>','"':'"',"'":'&#39;' }[c]));
}
/* Validate a URL scheme before putting it in an href. Prevents javascript:/
   data: URLs from becoming clickable XSS vectors. */
function safeUrl (u) {
  if (!u) return '';
  try { const url = new URL(u, location.origin); return ['http:','https:','tel:','mailto:'].includes(url.protocol) ? u : ''; }
  catch { return ''; }
}
function fill (sel, items, blank) {
  sel.innerHTML = `<option value="">${blank}</option>` +
    items.map(i => `<option value="${esc(i.key ?? i)}">${esc(i.label ?? i)}</option>`).join('');
}

/* ---- preview mode -------------------------------------------------------
   Lets you see exactly what the tool produces before spending an hour on the
   Blaze upgrade, API keys and a functions deploy. Everything below is
   FABRICATED and labelled as such — no search runs, nothing is written to
   Firestore, and no key is used. Activate with ?preview=1 (no login needed),
   or from the offer shown when the backend cannot be reached.            */
const PREVIEW = new URLSearchParams(location.search).get('preview') === '1';

const PREVIEW_TAXONOMY = {
  industries: [
    {key:'auto_components',label:'Auto Components'},{key:'fabrication',label:'Fabrication & Job Work'},
    {key:'machining',label:'CNC / Precision Machining'},{key:'pharma',label:'Pharma & Life Sciences'},
    {key:'food_bev',label:'Food & Beverage'},{key:'packaging',label:'Packaging & Labelling'},
    {key:'plastics',label:'Plastics & Moulding'},{key:'electronics',label:'Electronics & EMS'},
    {key:'foundry',label:'Foundry & Casting'},{key:'textile',label:'Textile'},
    {key:'system_integrator',label:'System Integrator / SPM'},{key:'education',label:'Education & Training'},
    {key:'warehouse',label:'Warehouse & Logistics'},{key:'general_mfg',label:'General Manufacturing'}],
  applications: [
    {key:'welding',label:'Welding'},{key:'pick_place',label:'Pick & Place / Material Handling'},
    {key:'palletizing',label:'Palletizing'},{key:'machine_tending',label:'Machine Tending'},
    {key:'deburring',label:'Deburring / Surface Finishing'},{key:'dispensing',label:'Dispensing / Gluing'},
    {key:'inspection',label:'Vision / Inspection'},{key:'assembly',label:'Assembly / Screwdriving'},
    {key:'conveyor',label:'Conveyor Systems'},{key:'structures',label:'Aluminium Profile & Structures'},
    {key:'drives_servo',label:'Drives & Servo'},{key:'workstation',label:'Workstation / Ergonomics'},
    {key:'education_kit',label:'Education / Training Kit'},{key:'general',label:'General Automation'}],
  segments: [{key:'msme',label:'MSME (< 100 staff)'},{key:'mid',label:'Mid-corp (100-500)'},{key:'enterprise',label:'Enterprise (500+)'}],
};

/* Scores below are what the real scorer in lib/scoring.js actually returns for
   these inputs — so the preview is a faithful demo, not a fantasy. */
const PREVIEW_ROWS = [
  {score:78,tier:'A',company:'Precision Auto Components Pvt Ltd',city:'Chakan',state:'Maharashtra',primaryType:'Auto Component Manufacturer',industryKey:'auto_components',industryLabel:'Auto Components',industryEvidence:['CNC machining','auto parts'],applicationKey:'machine_tending',applicationLabel:'Machine Tending',brand:'Fanuc',leadType:'Direct',phone:'+91 98220 11223',email:'purchase@precisionauto.in',website:'https://precisionauto.in',placeId:'ChIJdummy1',mapsUri:'https://maps.google.com/?q=Chakan',buyingStage:'in_market',breakdown:[{factor:'Industry match',points:30},{factor:'Application match',points:25},{factor:'Website signals',points:15},{factor:'Contactable',points:8}],recommendedAction:'Call the purchase manager — strong signals across welding + material handling.',isDuplicate:false},
  {score:65,tier:'B',company:'Shree Fabrication Works',city:'Pimpri',state:'Maharashtra',primaryType:'Fabrication & Job Work',industryKey:'fabrication',industryLabel:'Fabrication & Job Work',industryEvidence:['welding','structural steel'],applicationKey:'welding',applicationLabel:'Welding',brand:'ABB',leadType:'IndiaMART',phone:'+91 99700 44556',email:'shree.fab@gmail.com',website:'https://shreefab.in',placeId:'ChIJdummy2',mapsUri:'https://maps.google.com/?q=Pimpri',buyingStage:'awareness',breakdown:[{factor:'Industry match',points:30},{factor:'Application match',points:20},{factor:'Contactable',points:10},{factor:'IndiaMART lead',points:5}],recommendedAction:'Sent an IndiaMART enquiry — follow up with a brochure.',isDuplicate:false},
  {score:52,tier:'C',company:'National Plastics Ltd',city:'Nashik',state:'Maharashtra',primaryType:'Plastics & Moulding',industryKey:'plastics',industryLabel:'Plastics & Moulding',industryEvidence:['injection moulding','plastic parts'],applicationKey:'pick_place',applicationLabel:'Pick & Place / Material Handling',brand:'Kawasaki',leadType:'Direct',phone:'+91 98900 33445',email:'enquiry@nationalplastics.in',website:'https://nationalplastics.in',placeId:'ChIJdummy3',mapsUri:'https://maps.google.com/?q=Nashik',buyingStage:'awareness',breakdown:[{factor:'Industry match',points:25},{factor:'Application match',points:20},{factor:'Contactable',points:7}],recommendedAction:'Mention pick-place ROI case studies from similar plastic-moulding shops.',isDuplicate:false},
  {score:71,tier:'B',company:'Precision Auto Components Pvt Ltd',city:'Chakan',state:'Maharashtra',primaryType:'Auto Component Manufacturer',industryKey:'auto_components',industryLabel:'Auto Components',industryEvidence:['CNC machining','auto parts'],applicationKey:'machine_tending',applicationLabel:'Machine Tending',brand:'Fanuc',leadType:'Direct',phone:'+91 98220 11223',email:'purchase@precisionauto.in',website:'https://precisionauto.in',placeId:'ChIJdummy1',mapsUri:'https://maps.google.com/?q=Chakan',buyingStage:'in_market',breakdown:[{factor:'Industry match',points:30},{factor:'Application match',points:25},{factor:'Website signals',points:15},{factor:'Contactable',points:8}],recommendedAction:'Already in the lead board — call the purchase manager.',isDuplicate:true,duplicateOf:{source:'Lead Board',matchedOn:'phone'}},
];

function previewRows () {
  return JSON.parse(JSON.stringify(PREVIEW_ROWS));
}

function enterPreview () {
  $('previewTag').classList.remove('hide');
  fill($('fInd'), PREVIEW_TAXONOMY.industries, 'Any industry');
  fill($('fApp'), PREVIEW_TAXONOMY.applications, 'Any application');
  fill($('assignTo'), [], '—');
  ROWS = previewRows();
  render({ counts: { found: ROWS.length, fresh: ROWS.filter(r => !r.isDuplicate).length, duplicates: ROWS.filter(r => r.isDuplicate).length }, billableCalls: 0 });
  msg('Preview mode — sample data only. Sign in on the Leads Tracker and the Cloud Functions will be wired automatically.', 'info');
}

/* ---- auth state ---- */
if (auth) {
  onAuthStateChanged(auth, async user => {
    const bar = $('authBar');
    if (!user) {
      bar.innerHTML = `<input id="email" type="email" placeholder="email" style="width:200px;"><input id="password" type="password" placeholder="password" style="width:140px;"><button class="btn btn-primary" id="signIn">Sign in</button>`;
      $('signIn').onclick = doSignIn;
      $('password').addEventListener('keydown', e => { if (e.key === 'Enter') doSignIn(); });
      $('pullIM').style.display = 'none';
      $('assignTo').innerHTML = '<option value="">—</option>';
      return;
    }
    try {
      const tax = (await call.taxonomy()).data;
      TAX = tax;
      fill($('fInd'), tax.industries, 'Any industry');
      fill($('fApp'), tax.applications, 'Any application');
      if (tax.assignTo) fill($('assignTo'), tax.assignTo.map(n => ({key:n,label:n})), '—');
      bar.innerHTML = `<span class="who">Signed in as ${esc(user.email)}</span><button class="btn" id="signOut">Sign out</button>`;
      $('signOut').onclick = () => signOut(auth);
      $('pullIM').style.display = '';
    } catch (e) {
      const code = (e && e.code) || '';
      if (code === 'functions/permission-denied') {
        msg(`Signed in as ${esc(user.email)}, but this account has no active role in the Leads Tracker. Ask the Super Admin to add it. (${esc(e.message)})`, 'err');
      } else if (code === 'functions/unauthenticated') {
        msg('Session expired — sign in again.', 'err');
      } else if (code === 'functions/internal' || code === 'functions/not-found') {
        msg('Signed in, but the Cloud Functions are not reachable — they have probably not been deployed yet. Run <code>firebase deploy --only functions</code>. '
          + 'In the meantime you can <a href="?preview=1">see the tool with sample data</a>.', 'err');
      } else {
        msg(`Signed in, but loading the taxonomy failed: ${esc(e.message)}`, 'err');
      }
      console.error('getTaxonomy failed', e);
    }
  });
}

const AUTH_ERRORS = {
  'auth/invalid-credential':     'Incorrect email or password.',
  'auth/user-not-found':         'No account with that email.',
  'auth/wrong-password':         'Incorrect password.',
  'auth/invalid-email':          "That doesn't look like a valid email address.",
  'auth/too-many-requests':      'Too many failed attempts — try again in a few minutes.',
  'auth/network-request-failed': 'Network error — check your connection and try again.',
  'auth/unauthorized-domain':    'This page is not on an authorised domain. Add it under Firebase Console → Authentication → Settings → Authorised domains.',
  'auth/api-key-not-valid':      'The Firebase apiKey in this file is wrong. Copy the one from index.html.',
  'auth/operation-not-allowed':  'Email/password sign-in is switched off for this project.',
};

async function doSignIn () {
  const em = $('email').value.trim(), pw = $('password').value;
  if (!em || !pw) { msg('Enter both email and password.', 'err'); return; }
  const b = $('signIn'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Signing in…';
  try {
    await signInWithEmailAndPassword(auth, em, pw);
  } catch (e) {
    const code = (e && e.code) || '';
    msg(AUTH_ERRORS[code] || `Sign-in failed: ${esc(e.message)}${code ? ` (${esc(code)})` : ''}`, 'err');
    console.error('sign-in failed', e);
  } finally { b.disabled = false; b.textContent = 'Sign in'; }
}
$('signIn').onclick = doSignIn;
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') doSignIn(); });
$('signOut').onclick = () => auth && signOut(auth);
if (!auth && !PREVIEW) {
  msg('Firebase could not start on this page. If you opened the file from disk, ' +
      'use <a href="?preview=1">preview mode</a> or serve it over http.', 'err');
}

fill($('fState'), STATES, 'Any state');
$('fState').value = 'Maharashtra';

/* live query preview so nobody wastes a billable call on a vague search */
function preview () {
  const bits = [];
  if ($('fKw').value) bits.push($('fKw').value);
  const a = $('fApp').selectedOptions[0]; if (a && a.value) bits.push(a.textContent.split('/')[0].trim().toLowerCase());
  const i = $('fInd').selectedOptions[0]; if (i && i.value) bits.push(i.textContent.split('&')[0].trim().toLowerCase());
  if (!bits.length) bits.push('manufacturing');
  const where = [$('fCity').value, $('fState').value, 'India'].filter(Boolean).join(', ');
  $('qPreview').textContent = `→ "${bits.join(' ')} companies in ${where}"`;
}
['fCity','fApp','fInd','fKw','fState'].forEach(id => $(id).addEventListener('input', preview));
preview();
if (PREVIEW) enterPreview();

/* ---- search ---- */
$('go').onclick = async () => {
  if (PREVIEW) {
    ROWS = previewRows(); SELECTED.clear();
    render({ counts: { found: ROWS.length, fresh: ROWS.filter(r => !r.isDuplicate).length,
                       duplicates: ROWS.filter(r => r.isDuplicate).length }, billableCalls: 0 });
    msg('Sample output — fabricated companies, real scoring logic. Nothing was searched or saved.', 'info');
    return;
  }
  const btn = $('go');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Searching…';
  msg('');
  try {
    const res = (await call.search({
      state: $('fState').value, city: $('fCity').value.trim(),
      industryKey: $('fInd').value, applicationKey: $('fApp').value, keywords: $('fKw').value.trim(),
    })).data;
    ROWS = res.results || []; SELECTED.clear();
    render(res);
    msg(`Found ${res.counts.found} prospects — ${res.counts.fresh} new, ${res.counts.duplicates} already on the lead board. Cost: ${res.billableCalls} API call(s).`, 'ok');
  } catch (e) {
    const code = (e && e.code) || '';
    if (code === 'functions/permission-denied')
      msg('Signed in, but this account has no active role. Ask the Super Admin to add it.', 'err');
    else if (code === 'functions/unauthenticated')
      msg('Session expired — sign in again.', 'err');
    else
      msg(`Search failed: ${esc(e.message)}`, 'err');
    console.error('search failed', e);
  } finally {
    btn.disabled = false; btn.textContent = 'Find prospects';
  }
};

$('pullIM').onclick = async () => {
  if (PREVIEW) { msg('Preview mode — IndiaMART is not contacted.', 'err'); return; }
  const b = $('pullIM'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Syncing…';
  try {
    const r = (await call.imNow()).data;
    msg(r.skipped ? 'IndiaMART was polled less than 5 minutes ago — skipped to protect the key.'
      : r.error ? `IndiaMART error: ${esc(r.error)}`
      : `IndiaMART: pulled ${r.pulled}, added ${r.written} new, ${r.duplicates} already known.`,
      r.error ? 'err' : 'ok');
  } catch (e) { msg(`IndiaMART sync failed: ${esc(e.message)}`, 'err'); }
  finally { b.disabled = false; b.textContent = 'Sync IndiaMART now'; }
};

/* ---- render ---- */
function render (res) {
  $('results').classList.remove('hide');
  $('kFound').textContent = res.counts.found;
  $('kFresh').textContent = res.counts.fresh;
  $('kDup').textContent   = res.counts.duplicates;
  $('kA').textContent     = ROWS.filter(r => !r.isDuplicate && r.tier === 'A').length;
  $('kCalls').textContent = res.billableCalls;

  $('tbody').innerHTML = ROWS.map((r, i) => {
    const dup = r.isDuplicate;
    const why = (r.breakdown || []).map(b => `+${b.points} ${b.factor}`).join(' · ');
    const contact = [
      r.phone ? `<a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>` : '',
      r.email ? `<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>` : '',
      r.website ? (() => { const u = safeUrl(r.website); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">site</a>` : ''; })() : '',
    ].filter(Boolean).join('<br>') || '<span class="meta">none</span>';
    return `<tr class="${dup ? 'dup' : ''}" data-i="${i}">
      <td>${dup ? '' : `<input type="checkbox" class="pick" data-i="${i}" style="width:auto">`}</td>
      <td><span class="score" style="color:${r.tier === 'A' ? 'var(--good)' : r.tier === 'B' ? 'var(--warn)' : 'var(--muted)'}">${r.score}</span>
          <span class="badge b-${r.tier.toLowerCase()}">${r.tier}</span>
          ${r.buyingStage === 'in_market' ? '<br><span class="badge b-hot">IN MARKET</span>' : ''}</td>
      <td><div class="co">${esc(r.company)}</div>
          <div class="meta">${esc(r.primaryType || '')}</div>
          ${dup ? `<span class="badge b-dup">already a ${esc(r.duplicateOf.source)} — matched on ${esc(r.duplicateOf.matchedOn)}</span>` : ''}</td>
      <td>${esc(r.city || '')}<div class="meta">${esc(r.state || '')}</div></td>
      <td>${esc(r.industryLabel || '')}<div class="meta">${esc((r.industryEvidence || []).slice(0,2).join(', '))}</div></td>
      <td>${esc(r.applicationLabel || '')}</td>
      <td>${esc(r.brand || '')}<div class="meta">${esc(r.leadType || '')}</div></td>
      <td>${contact}</td>
      <td class="bd">${esc(why)}<div class="meta">${esc(r.recommendedAction || '')}</div></td>
      <td>${(() => { const u = r.mapsUri ? safeUrl(r.mapsUri) : ''; return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">map</a>` : ''; })()}</td>
    </tr>`;
  }).join('');

  document.querySelectorAll('.pick').forEach(cb => cb.onchange = () => {
    const i = Number(cb.dataset.i);
    cb.checked ? SELECTED.add(i) : SELECTED.delete(i);
    syncSel();
  });
  syncSel();
}

function syncSel () {
  $('selCount').textContent = SELECTED.size;
  $('promote').disabled = SELECTED.size === 0;
}
function setSel (pred) {
  SELECTED.clear();
  ROWS.forEach((r, i) => { if (!r.isDuplicate && pred(r)) SELECTED.add(i); });
  document.querySelectorAll('.pick').forEach(cb => cb.checked = SELECTED.has(Number(cb.dataset.i)));
  syncSel();
}
$('selAll').onclick   = () => setSel(() => true);
$('selA').onclick     = () => setSel(r => r.tier === 'A');
$('clearSel').onclick = () => setSel(() => false);

$('promote').onclick = async () => {
  if (PREVIEW) { msg('Preview mode — nothing is written to the lead board.', 'err'); return; }
  const ids = [...SELECTED].map(i => `gmaps_${ROWS[i].placeId}`);
  const b = $('promote'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Pushing…';
  try {
    const r = (await call.promote({ prospectIds: ids, assignTo: $('assignTo').value })).data;
    msg(`Pushed ${r.promoted} prospect(s) into the lead board. They appear in the tracker as "Not Contacted".`, 'ok');
    setSel(() => false);
  } catch (e) { msg(`Push failed: ${esc(e.message)}`, 'err'); }
  finally { b.disabled = false; b.innerHTML = 'Push <span id="selCount">0</span> to Leads'; syncSel(); }
};

$('exportCsv').onclick = () => {
  const cols = ['score','tier','company','city','state','industryLabel','applicationLabel','brand','leadType','phone','email','website','address','recommendedAction','isDuplicate'];
  const csv = [cols.join(',')].concat(ROWS.map(r =>
    cols.map(c => `"${String(r[c] ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: 'syncaxis_prospects.csv' });
  a.click(); URL.revokeObjectURL(url);
};
</script>
</body>
</html>
